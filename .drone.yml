---
name: ui-amd64
kind: pipeline
type: docker
platform:
  arch: amd64
  os: linux
steps:
  - name: publish
    image: plugins/docker
    settings:
      dockerfile: ui/Dockerfile
      repo: hlseven/quality-cql-studio
      tags:
        - ${DRONE_COMMIT_BRANCH}-linux-amd64
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
---
name: ui-arm64
kind: pipeline
type: docker
platform:
  arch: arm64
  os: linux
steps:
  - name: publish
    image: plugins/docker
    settings:
      dockerfile: ui/Dockerfile
      repo: hlseven/quality-cql-studio
      tags:
        - ${DRONE_COMMIT_BRANCH}-linux-arm64
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
---
name: ui-manifest
kind: pipeline
type: docker
depends_on:
  - ui-amd64
  - ui-arm64
steps:
  - name: publish-manifest
    image: plugins/manifest
    settings:
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      target: hlseven/quality-cql-studio:latest
      template: hlseven/quality-cql-studio:master-OS-ARCH
      platforms:
        - linux/amd64
        - linux/arm64
      exclude:
        - master
trigger:
  branch:
    include:
      - master
  status:
    - success
