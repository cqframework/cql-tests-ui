# Development-only stack: HAPI FHIR R4, Authentik IdP, cql-studio-server Postgres for SSO,
# CQL Tests Runner, and CQL Tests Results.
# Secrets below are intentionally hardcoded and checked in for local SSO testing.
# Do not reuse these values in production.
#
# Usage:
#   docker compose -f docker/docker-compose.development.yml up -d
#   or from monorepo root:
#   npm run docker:up
#
# Networking: run cql-studio-server and OpenCode on the host
# (npm run start:server and npm run start:opencode), not in this compose file.
# Authentik is published on host port 9000; host processes use http://localhost:9000.
# Inside another container, localhost:9000 is that container — use host.docker.internal:9000
# or join this compose network and use http://authentik-server:9000 for server-to-IdP calls.
#
# CQL Tests Runner:  http://localhost:8091  (container port 3000, `server` mode)
# CQL Tests Results: http://localhost:8092/index.json  (nginx on container port 80)
#
# The runner container cannot use localhost for HAPI (that is the runner itself).
# Point the runner's FHIR base URL at the compose service name, e.g.:
#   Settings → Runner FHIR Base URL = http://hapi-r4-data:8080/fhir
#   or export CQL_STUDIO_RUNNER_FHIR_BASE_URL=http://hapi-r4-data:8080/fhir
# Browser/host access to HAPI remains http://localhost:8080/fhir.
# Optional UI defaults for this stack:
#   CQL_STUDIO_RUNNER_BASE_URL=http://localhost:8091
#   CQL_STUDIO_RUNNER_FHIR_BASE_URL=http://hapi-r4-data:8080/fhir
#   CQL_STUDIO_DEFAULT_TEST_RESULTS_INDEX_URL=http://localhost:8092/index.json

services:
  hapi-r4-data:
    image: hapiproject/hapi:v8.10.0-3
    container_name: cql-studio-hapi-r4-data
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      spring.main.allow-bean-definition-overriding: "true"
      hapi.fhir.expunge_enabled: "true"
      hapi.fhir.allow_multiple_delete: "true"
      hapi.fhir.bulk_export_enabled: "true"
      hapi.fhir.bulk_import_enabled: "true"
      hapi.fhir.enable_index_missing_fields: "true"
      hapi.fhir.cdshooks.enabled: "true"
      hapi.fhir.cr.enabled: "true"
      spring.jpa.properties.hibernate.search.enabled: "true"
      spring.jpa.properties.hibernate.search.backend.type: lucene
      # Compose treats $ as interpolation; $$ yields a single $ in the container.
      spring.jpa.properties.hibernate.search.backend.analysis.configurer: ca.uhn.fhir.jpa.search.HapiHSearchAnalysisConfigurers$$HapiLuceneAnalysisConfigurer
      HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: "true"
      hapi.fhir.cr.cql.terminology.valueset_preexpansion_mode: USE_IF_PRESENT
      hapi.fhir.cr.cql.terminology.valueset_expansion_mode: PERFORM_NAIVE_EXPANSION
      hapi.fhir.cr.cql.terminology.valueset_membership_mode: USE_EXPANSION
      hapi.fhir.cr.cql.terminology.code_lookup_mode: USE_VALIDATE_CODE_OPERATION
      hapi.fhir.cr.cql.data.search_parameter_mode: USE_SEARCH_PARAMETERS
      hapi.fhir.cr.cql.data.terminology_parameter_mode: FILTER_IN_MEMORY
      hapi.fhir.cr.cql.data.profile_mode: DECLARED
      hapi.fhir.pre_expand_value_sets: "true"
      hapi.fhir.enable_task_pre_expand_value_sets: "true"
      hapi.fhir.maximum_expansion_size: "20000"
      hapi.fhir.pre_expand_value_sets_max_count: "20000"
      hapi.fhir.pre_expand_value_sets_default_count: "20000"
    restart: unless-stopped

  cql-studio-server-postgresql:
    image: docker.io/library/postgres:18-alpine
    container_name: cql-studio-server-postgresql
    environment:
      POSTGRES_DB: cql_studio_development
      POSTGRES_USER: cql_studio
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 5s
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    volumes:
      - server-database:/var/lib/postgresql
    restart: unless-stopped

  authentik-postgresql:
    image: docker.io/library/postgres:18-alpine
    container_name: cql-studio-authentik-postgresql
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: cql-studio-authentik-pg
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 5s
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    volumes:
      - authentik-database:/var/lib/postgresql
    restart: unless-stopped

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: cql-studio-authentik-server
    command: server
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: cql-studio-authentik-pg
      AUTHENTIK_SECRET_KEY: cql-studio-authentik-secret-key-development-only-not-for-production
      AUTHENTIK_BOOTSTRAP_EMAIL: administrator@localhost
      AUTHENTIK_BOOTSTRAP_PASSWORD: password
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - authentik-data:/data
    shm_size: 512mb
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: cql-studio-authentik-worker
    command: worker
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: cql-studio-authentik-pg
      AUTHENTIK_SECRET_KEY: cql-studio-authentik-secret-key-development-only-not-for-production
      AUTHENTIK_BOOTSTRAP_EMAIL: administrator@localhost
      AUTHENTIK_BOOTSTRAP_PASSWORD: password
    volumes:
      - authentik-data:/data
      - ./authentik/blueprints:/blueprints/custom:ro
    shm_size: 512mb
    restart: unless-stopped

  cql-tests-runner:
    image: docker.io/hlseven/quality-cql-tests-runner:latest
    container_name: cql-studio-cql-tests-runner
    command: ["server", "--port", "3000"]
    ports:
      - "8091:3000"
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 5s
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
    restart: unless-stopped

  cql-tests-results:
    image: docker.io/hlseven/quality-cql-tests-results:latest
    container_name: cql-studio-cql-tests-results
    ports:
      - "8092:80"
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 5s
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/index.json"]
    restart: unless-stopped

volumes:
  server-database:
  authentik-database:
  authentik-data:
