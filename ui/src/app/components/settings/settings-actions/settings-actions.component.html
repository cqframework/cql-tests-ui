@switch (variant()) {
  @case ('save') {
    <div class="mt-3">
      <button [id]="'save-settings-btn' + idSuffix()" class="btn btn-primary w-100" (click)="onSave()">
        <span class="bi bi-file-check"></span> Save Settings
      </button>
    </div>
  }
  @case ('toolbar') {
    <div class="d-flex flex-wrap align-items-center gap-2">
      <button [id]="'export-settings-btn' + idSuffix()" class="btn btn-secondary btn-sm" (click)="onExport()">
        <span class="bi bi-download"></span> Export
      </button>
      <button [id]="'import-settings-btn' + idSuffix()" class="btn btn-secondary btn-sm" (click)="onImport()">
        <span class="bi bi-upload"></span> Import
      </button>
      <button [id]="'reset-clipboard-btn' + idSuffix()" class="btn btn-secondary btn-sm" (click)="onResetClipboard()">
        <span class="bi bi-clipboard-x"></span> Reset Clipboard
      </button>
    </div>
  }
  @default {
    <div class="col-12 p-4 d-flex justify-content-between align-items-center">
      <div>
        <button [id]="'save-settings-btn' + idSuffix()" class="btn btn-primary" (click)="onSave()">
          <span class="bi bi-file-check"></span> Save Settings
        </button>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button [id]="'export-settings-btn' + idSuffix()" class="btn btn-secondary btn-sm" (click)="onExport()">
          <span class="bi bi-download"></span> Export
        </button>
        <button [id]="'import-settings-btn' + idSuffix()" class="btn btn-secondary btn-sm" (click)="onImport()">
          <span class="bi bi-upload"></span> Import
        </button>
        <button [id]="'reset-clipboard-btn' + idSuffix()" class="btn btn-secondary btn-sm" (click)="onResetClipboard()">
          <span class="bi bi-clipboard-x"></span> Reset Clipboard
        </button>
      </div>
    </div>
  }
}
